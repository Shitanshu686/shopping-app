<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ShopEase</title>

    <link rel="stylesheet" href="css/signup.css">

</head>

<body>

    <main class="signup-page">

        <section class="signup-card">

            <!-- HEADER -->

            <div class="signup-header">

                <img src="images/logo.png" alt="ShopEase Logo" class="signup-logo">

                <h1>Create Account</h1>

                <p>
                    Join ShopEase and start shopping
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" placeholder="Enter your full name" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" placeholder="Create a password" autocomplete="new-password"
                            required>

                        <button type="button" id="togglePassword" class="password-toggle">
                            Show
                        </button>

                    </div>
                </div>
                <div class="password-strength">

                    <div id="strengthBar" class="strength-bar"></div>

                </div>

                <p id="strengthText" class="strength-text"></p>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="confirmPassword" placeholder="Confirm your password"
                            autocomplete="new-password" required>

                        <button type="button" id="toggleConfirmPassword" class="password-toggle">
                            Show
                        </button>

                    </div>
                </div>


                <button type="submit" class="signup-button">
                    Create Account
                </button>


                <p id="signupMessage" class="signup-message"></p>

            </form>


            <!-- LOGIN -->

            <div class="login-section">

                <span>Already have an account?</span>

                <a href="Login.html">
                    Login
                </a>

            </div>


            <!-- BACK -->

            <a href="Shopping.html" class="back-link">
                ← Back to Shop
            </a>

        </section>

    </main>


    <script src="js/signup.js"></script>

</body>

</html>
