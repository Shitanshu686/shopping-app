<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShopEase</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- LOGO -->

            <div class="login-header">

                <img src="images/logo.png" alt="ShopEase Logo" class="login-logo">

                <h1>Welcome Back</h1>

                <p>
                    Login to your ShopEase account
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="password-toggle">
                            Show
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-me">

                        <input type="checkbox" id="rememberMe">

                        <span>Remember me</span>

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-button">
                    Login
                </button>


                <p id="loginMessage" class="login-message"></p>

            </form>


            <!-- SIGNUP -->

            <div class="signup-section">

                <span>Don't have an account?</span>

                <a href="signup.html">
                    Create Account
                </a>

            </div>


            <!-- BACK -->

            <a href="Shopping.html" class="back-link">
                ← Back to Shop
            </a>

        </section>

    </main>


    <script src="js/login.js"></script>
    <script>
        console.log("LOGIN JS LOADED");
    </script>
</body>

</html>
