<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - ShopEase</title>

    <link rel="stylesheet" href="css/product-details.css">
    <link rel="stylesheet" href="css/similar-products.css">
    <link rel="stylesheet" href="css/admin-specification.css">
    <link rel="stylesheet" href="css/feedback.css">
    <link rel="stylesheet" href="css/product-rating.css">

</head>

<body>

    <!-- =========================
         PRODUCT DETAILS
    ========================== -->

    <main>

        <div id="productDetailsToast" class="product-details-toast">
        </div>

        <section id="productDetails" class="product-details">

            <!-- Product details will be loaded here -->

        </section>


        <!-- =========================
         ADMIN SPECIFICATION
    ========================== -->

        <section id="adminSpecificationSection" style="display: none;">

            <h2>Add Product Specification</h2>

        </section>

    </main>
    <!-- =========================
     PRODUCT RATING
========================== -->

    <section class="rating-section">

        <div class="rating-container">

            <div class="rating-header">

                <h2>Rate This Product</h2>

                <p id="ratingMessage">
                    Only verified buyers can rate this product.
                </p>

            </div>

            <div id="ratingFormContainer">

                <!-- product-rating.js will handle this -->

            </div>

        </div>

    </section>
    <!-- =========================
     CUSTOMER FEEDBACK
========================== -->

    <section class="feedback-section">

        <div class="feedback-container">

            <div class="feedback-header">

                <h2>Customer Feedback</h2>

                <p>What customers are saying about this product</p>

            </div>


            <!-- ======================
             ADD FEEDBACK
        ======================= -->

            <div id="feedbackFormContainer">

                <!-- feedback.js will handle this -->

            </div>


            <!-- ======================
             FEEDBACK LIST
        ======================= -->

            <div id="feedbackList">

                <!-- Feedback will be loaded here -->

            </div>

        </div>

    </section>
    <section class="similar-products-section">

        <h2>Similar Products</h2>

        <div id="similarProducts"></div>

    </section>
    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/api.js"></script>

    <script src="js/product-details-page.js"></script>
    <script src="js/product-specifications.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/product-rating.js"></script>
    <script src="js/similar-products.js"></script>
    <script src="js/admin-specification.js"></script>

</body>

</html>
