<!-- =========================================
     ShopEase - Advanced Hero Carousel
     ========================================= -->

<section class="hero-carousel" aria-label="ShopEase promotions">

    <div class="hero-carousel-track">

        <div class="hero-slide">
            <img
                src="images/banner.png"
                alt="ShopEase Special Offers">
        </div>

        <div class="hero-slide">
            <img
                src="images/s25-ultra.jpg"
                alt="Samsung Galaxy S25 Ultra">
        </div>

        <div class="hero-slide">
            <img
                src="images/iphone17.jpg"
                alt="iPhone 17">
        </div>

        <div class="hero-slide">
            <img
                src="images/sony-xm6.jpg"
                alt="Sony XM6 Headphones">
        </div>

    </div>


    <!-- Previous Button -->

    <button
        class="hero-carousel-btn hero-carousel-prev"
        type="button"
        aria-label="Previous slide">

        ❮

    </button>


    <!-- Next Button -->

    <button
        class="hero-carousel-btn hero-carousel-next"
        type="button"
        aria-label="Next slide">

        ❯

    </button>


    <!-- Carousel Dots -->

    <div class="hero-carousel-dots"></div>

</section>
