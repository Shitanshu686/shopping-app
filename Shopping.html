<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/navigation.css">

    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/product-card.css">

    <link rel="stylesheet" href="css/wishlist.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/footer.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="container navbar">

            <div class="logo-section">

                <img src="images/logo.png" class="logo">

                <h1>ShopEase</h1>

            </div>

            <div class="search-box">

                <input type="text" id="searchBox" placeholder="Search Products..." onkeyup="searchProduct(this.value)">

            </div>

            <nav>

                <a href="#">Home</a>

                <a href="#">Products</a>

                <a href="#" onclick="openCart()">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>

                <div class="profile-container">

                    <button id="loginLink" class="profile-button">
                        Login
                    </button>

                    <div id="profileDropdown" class="profile-dropdown">

                        <div class="profile-info">

                            <h3 id="profileName"></h3>

                            <p id="profileEmail"></p>

                            <p>
                                Role:
                                <span id="profileRole"></span>
                            </p>
                            <button id="adminPanelButton">
                                Admin Panel
                            </button>
                        </div>

                        <button id="logoutButton" class="logout-button">
                            Logout
                        </button>

                    </div>

                </div>

            </nav>

        </div>

    </header>

    <!-- ================= BANNER ================= -->

    <section class="banner">

        <img src="images/banner.png">

    </section>

    <!-- ================= CATEGORIES ================= -->

    <section class="categories">

        <button data-category="All">All</button>

        <button data-category="Smartphones">📱 Smartphones</button>

        <button data-category="Fashion">👕 Fashion</button>

        <button data-category="Watches">⌚ Watches</button>

        <button data-category="Shoes">👟 Shoes</button>

        <button data-category="Luggage">👜 Bags</button>

        <button data-category="BAT">🏏 Sports</button>

    </section>

    <!-- ================= PRODUCTS ================= -->

    <section class="products-section">

        <h2>Featured Products</h2>

        <div class="Products" id="products">

        </div>

    </section>

    <!-- ================= CART ================= -->

    <div id="cartPanel">

        <div class="cart-header">

            <h2>🛒 My Cart</h2>

            <button onclick="closeCart()">✖</button>

        </div>

        <ul id="cartItems"></ul>

        <h3>Total : ₹<span id="total">0</span></h3>

        <h4>Total Items : <span id="itemCount">0</span></h4>

        <button onclick="buyNow()">
            Checkout
        </button>

    </div>

    <!-- ================= TOAST ================= -->

    <div id="toast"></div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>

            © 2026 ShopEase | Developed by Shitanshu Jha

        </h3>

    </footer>
    <script src="js/toast.js"></script>
    <script src="js/search.js"></script>
    <script src="js/api.js"></script>
    <script src="js/product.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/category.js"></script>
    <script src="script.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
